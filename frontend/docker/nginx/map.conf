# Basemap assets (tileset, sprites, city boundary). Missing files must answer 404 instead of falling back to index.html.
# Note: add_header in a location replaces all add_header directives of the server level.
# Security headers added there later have to be repeated in both locations below.
location /map/ {
    add_header Cache-Control 'public, max-age=604800';
}

# Tileset files carry their build date in the file name, so a new basemap always gets a new URL.
# The browser loads them via HTTP range requests, which nginx supports for static files out of the box.
location ~ ^/map/[^/]+\.pmtiles$ {
    add_header Cache-Control 'public, max-age=31536000, immutable';
}
